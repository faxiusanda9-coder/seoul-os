name: Sync official YouTube channels

on:
  schedule:
    # 08:00, 12:00 and 20:00 Asia/Shanghai (UTC+8)
    # GitHub scheduled jobs may start later than the cron time.
    - cron: "0 0,4,12 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Enabled artist ID, or all"
        required: false
        default: all
        type: string

permissions:
  contents: write

concurrency:
  group: youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      failed: ${{ steps.youtube.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Sync enabled verified channels
        id: youtube
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CHANNEL: ${{ inputs.channel || 'all' }}
        run: npm run sync:youtube -- --channel="$CHANNEL"
      - name: Validate generated data
        run: npm run build
      - name: Check for data changes
        id: changes
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/youtube)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit updated metadata
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube/*.json
          git commit -m "data: sync independent official YouTube channels"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main

  report-failure:
    needs: [sync, deploy]
    if: always() && needs.sync.outputs.failed == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "One or more channel syncs failed. Successful channels and valid expiry changes were preserved and deployed when needed."
          exit 1
